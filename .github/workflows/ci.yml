name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke tests (sandboxed DSH_HOME)
        run: node test.mjs
      - name: Load test (host-shape contract, sandboxed root)
        run: |
          mkdir -p "$RUNNER_TEMP/dsh-home"
          DSH_HOME="$RUNNER_TEMP/dsh-home" node loadtest.mjs
